name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Юнит-тесты
        run: python -m unittest discover -s tests -v
      - name: Дымовое тестирование CLI
        run: |
          python -m src.cli report --today 2026-06-01 --out out/report.csv
          python -m src.cli economics --plan 259200 --installments 10
